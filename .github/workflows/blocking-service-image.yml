# Builds the blocking service image (the Dockerfile runs the unit tests first) and pushes it
# to GHCR for the kubernetes platform. On OpenShift the BuildConfig builds it in-cluster instead.
#   ghcr.io/<owner>/kong-poc/blocking-service:main      (moves with main)
#   ghcr.io/<owner>/kong-poc/blocking-service:sha-<sha> (immutable)
name: blocking-service image
on:
  push:
    branches: [main]
    paths:
      - services/blocking-service/**
      - .github/workflows/blocking-service-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: blocking-service-image
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/blocking-service" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/blocking-service
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:main
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
