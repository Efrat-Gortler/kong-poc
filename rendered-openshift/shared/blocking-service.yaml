---
# Source: blocking-service/templates/service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocking-service
  labels:
    app.kubernetes.io/name: blocking-service
    app.kubernetes.io/part-of: kong-poc
  annotations:
    # roll out automatically whenever a new image is pushed to the ImageStreamTag
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"blocking-service:poc"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocking-service
        app.kubernetes.io/part-of: kong-poc
      annotations:
        checksum/config: 9e8c0752021d
    spec:
      
      containers:
        - name: app
          image: blocking-service:poc
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: blocking-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: blocking-db, key: password } }
            - name: ConnectionStrings__Blocking
              value: "Host=blocking-db;Port=5432;Database=blocking;Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: Reader__ApiKey
              valueFrom: { secretKeyRef: { name: blocklist-reader, key: api-key } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
      volumes:
        - name: config
          configMap: { name: blocking-service-config }

---
# Source: blocking-service/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blocking-db
  labels:
    app.kubernetes.io/name: blocking-db
    app.kubernetes.io/part-of: kong-poc
spec:
  serviceName: blocking-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocking-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocking-db
        app.kubernetes.io/part-of: kong-poc
    spec:
      
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.6
          env:
            - { name: POSTGRES_DB, value: blocking }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: blocking-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: blocking-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d blocking"]
            periodSeconds: 5
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

---
# Source: blocking-service/templates/build.yaml
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: blocking-service
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/Efrat-Gortler/kong-poc.git
      ref: main
    contextDir: services/blocking-service
    sourceSecret:
      name: github-source
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: blocking-service:poc
  resources:
    limits: { memory: 2Gi }
  triggers:
    - type: ConfigChange

---
# Source: blocking-service/templates/build.yaml
# In-cluster image build from GitHub (the workstation needs no .NET SDK or registry).
# Rebuild after a code change:  oc start-build blocking-service -n blocking --follow
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: blocking-service
spec:
  lookupPolicy:
    local: true          # lets the Deployment use the short name blocking-service:<tag>

---
# Source: blocking-service/templates/service.yaml
# Swagger UI for operators: <scheme>://<hostPrefix>.<appsDomain>/swagger

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: blocking-service
spec:
  host: blocking-blocking.apps-crc.testing
  to: { kind: Service, name: blocking-service }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
