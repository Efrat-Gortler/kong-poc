# Option A: Postgres + control plane (Admin API, Kong Manager, cluster listener) in konga-cp.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: konga-postgres
  namespace: openshift-gitops
  labels: { kong-poc/option: a }
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: kong-poc-a
  source:
    repoURL: https://github.com/Efrat-Gortler/kong-poc.git
    targetRevision: main
    path: charts/konga-postgres
    helm:
      valueFiles:
        - values.yaml
        - ../../cluster/values-openshift.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: konga-cp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: konga-cp
  namespace: openshift-gitops
  labels: { kong-poc/option: a }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: kong-poc-a
  sources:
    - repoURL: https://charts.konghq.com
      chart: kong
      targetRevision: 3.4.1
      helm:
        releaseName: konga-cp
        skipCrds: true
        valueFiles:
          - $values/charts/konga-values/values.yaml
          - $values/charts/konga-values/values-cp.yaml
          - $values/charts/konga-values/values-platform-openshift.yaml
    - repoURL: https://github.com/Efrat-Gortler/kong-poc.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: konga-cp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
