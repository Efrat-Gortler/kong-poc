apiVersion: v1
kind: ConfigMap
metadata:
  name: gslb-config
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info
      stats socket ipv4@127.0.0.1:9999 level admin
      maxconn 4096

    resolvers cluster
      parse-resolv-conf
      hold valid 10s

    defaults
      mode http
      log global
      option httplog
      option forwardfor
      timeout connect 5s
      timeout client 120s
      timeout server 120s
      default-server init-addr last,libc,none resolvers cluster check inter 2s fall 2 rise 2

    frontend gslb
      bind :8080
      # Tests may pin a request to one leg (bypasses round robin, still enters through the GSLB)
      {{- range .Values.legs }}
      use_backend pin_{{ .name }} if { req.hdr(x-gslb-leg) -m str {{ .name }} }
      {{- end }}
      default_backend legs
      http-response set-header x-gslb-leg %s

    backend legs
      balance roundrobin
      {{- range .Values.legs }}
      server {{ .name }} {{ .address }}
      {{- end }}
    {{ range .Values.legs }}
    backend pin_{{ .name }}
      server {{ .name }} {{ .address }}
    {{ end }}
  control.py: |
{{ .Files.Get "files/control.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gslb
  labels:
    app.kubernetes.io/name: gslb
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: 1   # one instance: drain state lives in this pod's memory
  selector:
    matchLabels:
      app.kubernetes.io/name: gslb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gslb
        app.kubernetes.io/part-of: kong-poc
      annotations:
        checksum/config: {{ toYaml .Values.legs | sha256sum | trunc 12 }}
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: haproxy
          image: {{ .Values.image }}
          args: ["haproxy", "-W", "-db", "-f", "/cfg/haproxy.cfg"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cfg, mountPath: /cfg, readOnly: true }
        - name: control
          image: {{ .Values.controlImage }}
          command: ["python", "-u", "/cfg/control.py"]
          ports:
            - { name: control, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: control }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cfg, mountPath: /cfg, readOnly: true }
      volumes:
        - name: cfg
          configMap:
            name: gslb-config
---
apiVersion: v1
kind: Service
metadata:
  name: gslb
spec:
  selector:
    app.kubernetes.io/name: gslb
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: control, port: 8081, targetPort: control }
---
{{ include "poc.expose" (list . "gslb" .Values.hostPrefix "gslb" "http") }}
---
# POC only: the drain/ready API. In production this is the GSLB vendor's own console.
{{ include "poc.expose" (list . "gslb-control" .Values.controlHostPrefix "gslb" "control") }}
