apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: kong-poc
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.image }}
          command: ["sh", "-c"]
          # Counters only: no RDB/AOF. Losing them just resets the windows.
          args:
            - >-
              exec redis-server --requirepass "$REDIS_PASSWORD"
              --save "" --appendonly no
              --databases {{ .Values.databases }}
              --maxmemory {{ .Values.maxMemory }} --maxmemory-policy volatile-ttl
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.passwordSecret }}, key: password }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-legs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.legNamespaceLabel | nindent 14 }}
      ports:
        - { port: 6379, protocol: TCP }
