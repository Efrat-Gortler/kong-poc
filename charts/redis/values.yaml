image: docker.io/library/redis:7.4.2
passwordSecret: redis-auth     # Secret in this namespace, key: password (created by scripts/create-secrets.sh)
# DB 0 = per-user counters shared by all legs; DB 1..N = route-wide counters, one per leg.
databases: 16
maxMemory: 128mb
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
# Namespaces whose pods may connect (the legs).
allowFromNamespaces: [leg1, leg2]
