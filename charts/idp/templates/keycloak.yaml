{{- if eq .Values.implementation "keycloak" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: kong-poc
      annotations:
        # re-import when the realm files change (dev mode keeps everything in memory)
        checksum/realms: {{ print (.Files.Get "files/realm-corp.json") (.Files.Get "files/realm-rogue.json") | sha256sum | trunc 12 }}
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          env:
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HOSTNAME, value: {{ .Values.internalUrl | quote }} }
            - { name: KC_HOSTNAME_ADMIN, value: {{ printf "%s://%s" (.Values.global.ingressScheme | default "https") (include "poc.host" (list . .Values.hostPrefix)) | quote }} }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "false" }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.admin }}, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.admin }}, key: password } }
          envFrom:
            # placeholders ${KC_...} in the realm files are resolved from these
            - secretRef: { name: {{ .Values.secrets.testCredentials }} }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: realms, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realms
          configMap:
            name: keycloak-realms
{{- end }}
