apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
data:
  realm-corp.json: |
{{ .Files.Get "files/realm-corp.json" | indent 4 }}
  realm-rogue.json: |
{{ .Files.Get "files/realm-rogue.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - { name: http, port: 8080, targetPort: http }
---
{{ include "poc.expose" (list . "keycloak" .Values.hostPrefix "keycloak" "http") }}
