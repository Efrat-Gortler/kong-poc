apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.component }}-echo
  labels:
    app.kubernetes.io/name: {{ .Values.component }}
    app.kubernetes.io/part-of: kong-poc
data:
  echo.py: |
{{ .Files.Get "files/echo.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.component }}
  labels:
    app.kubernetes.io/name: {{ .Values.component }}
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.component }}
        app.kubernetes.io/part-of: kong-poc
      annotations:
        checksum/code: {{ .Files.Get "files/echo.py" | sha256sum | trunc 12 }}
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: echo
          image: {{ .Values.image }}
          command: ["python", "-u", "/app/echo.py"]
          env:
            - { name: LEG, value: {{ .Values.global.leg | quote }} }
            - { name: COMPONENT, value: {{ .Values.component | quote }} }
            - { name: PORT, value: {{ .Values.port | quote }} }
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap:
            name: {{ .Values.component }}-echo
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.component }}
  labels:
    app.kubernetes.io/name: {{ .Values.component }}
    app.kubernetes.io/part-of: kong-poc
  annotations:
    {{- include "kong-route-lib.serviceTimeouts" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.component }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
