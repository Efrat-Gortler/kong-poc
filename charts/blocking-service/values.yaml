global:
  platform: openshift
  appsDomain: apps-crc.testing

# OpenShift: built in the cluster by a BuildConfig from Git (below).
# Kubernetes: pulled from GHCR, built by .github/workflows/blocking-service-image.yml.
image:
  repository: ghcr.io/efrat-gortler/kong-poc/blocking-service
  tag: main
  pullPolicy: Always          # `main` moves; restart the Deployment to pick up a new build
  pullSecret: ""              # e.g. ghcr-pull, if the GHCR package is private

build:
  gitUri: https://github.com/Efrat-Gortler/kong-poc.git
  gitRef: main
  contextDir: services/blocking-service
  sourceSecret: github-source       # basic-auth Secret (GitHub token) for the private repo
  imageTag: poc

hostPrefix: blocking-blocking   # Swagger UI at <hostPrefix>.<global.appsDomain>/swagger

auth:
  issuer: http://keycloak.idp.svc.cluster.local:8080/realms/corp
  audience: api://blocking-service
  blockerRole: blocker

secrets:
  readerKey: blocklist-reader        # key: api-key   (same value is copied to every leg)
  database: blocking-db              # keys: username, password

# Routes that may be blocked (route / user_on_route). Must match HTTPRoute names.
knownRoutes:
  - orders
  - orders-create
  - reports
  - reports-limited
  - users
  - users-limited
  - users-limited-2

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }

postgres:
  image: docker.io/library/postgres:16.6
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }

# Who may call the service: every leg (Lua plugin, OPA) and the router (Swagger route)
legNamespaceLabel:
  kong-poc/role: leg
