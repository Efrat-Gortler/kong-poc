apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blocking-db
  labels:
    app.kubernetes.io/name: blocking-db
    app.kubernetes.io/part-of: kong-poc
spec:
  serviceName: blocking-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocking-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocking-db
        app.kubernetes.io/part-of: kong-poc
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: blocking }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.database }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.database }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d blocking"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: blocking-db
spec:
  selector:
    app.kubernetes.io/name: blocking-db
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blocking-db-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blocking-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blocking-service
      ports:
        - { port: 5432, protocol: TCP }
