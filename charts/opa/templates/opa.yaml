{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
data:
  config.yaml: |
    services:
      blocking:
        url: {{ .Values.blockingService }}
        credentials:
          bearer:
            # resolved by OPA from the environment at startup
            token: "${BLOCKLIST_READER_KEY}"
    bundles:
      blocklist:
        service: blocking
        resource: {{ .Values.bundleResource }}
        polling:
          min_delay_seconds: {{ .Values.polling.minDelaySeconds }}
          max_delay_seconds: {{ .Values.polling.maxDelaySeconds }}
    labels:
      leg: {{ .Values.global.leg }}
    decision_logs:
      console: false
    status:
      console: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
        app.kubernetes.io/part-of: kong-poc
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: opa
          image: {{ .Values.image }}
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --diagnostic-addr=0.0.0.0:8282
            - --config-file=/config/config.yaml
            - --watch            # reload the policy when the ConfigMap changes
            - /policy
          env:
            - name: BLOCKLIST_READER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.readerSecret }}, key: api-key }
          ports:
            - { name: http, containerPort: 8181 }
            - { name: diag, containerPort: 8282 }
          readinessProbe:
            # ready only once the policy AND the data bundle are activated
            httpGet: { path: /health?bundles, port: diag }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: diag }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: policy, mountPath: /policy, readOnly: true }
      volumes:
        - name: config
          configMap: { name: opa-config }
        - name: policy
          configMap: { name: opa-policy }
---
apiVersion: v1
kind: Service
metadata:
  name: opa
spec:
  selector:
    app.kubernetes.io/name: opa
  ports:
    - { name: http, port: 8181, targetPort: http }
{{- end }}
