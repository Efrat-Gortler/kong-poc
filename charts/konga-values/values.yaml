# Option A (Kong Manager, hybrid mode): values for the official kong/kong chart, shared by the
# control plane (values-cp.yaml) and the data planes (values-dp.yaml). Infrastructure only: services,
# routes, plugins and consumers live in the control plane's Postgres and are managed in Kong Manager.
image:
  repository: kong/kong-gateway
  tag: "3.14.0.16"            # same Kong as option C

# Free mode for now: no license Secret. Once a license exists it is applied with POST /licenses on the
# control plane (scripts/option-a/apply-license.sh), which sends it to every data plane.
enterprise:
  enabled: true
  vitals:
    enabled: false
  portal:
    enabled: false
  rbac:
    enabled: false            # needs a license (docs/OPTION-A-DESIGN.md)

ingressController:
  enabled: false              # no KIC in option A
  installCRDs: false

# hybrid mTLS (cluster_mtls: shared): one certificate for CP and DPs, Secret from scripts/option-a/bootstrap.sh
secretVolumes:
  - kong-cluster-cert

env:
  cluster_mtls: shared
  cluster_cert: /etc/secrets/kong-cluster-cert/tls.crt
  cluster_cert_key: /etc/secrets/kong-cluster-cert/tls.key
  nginx_worker_processes: "2"
  log_level: notice

portal:
  enabled: false
portalapi:
  enabled: false
