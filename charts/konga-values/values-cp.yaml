# Control plane: Postgres-backed, Admin API + Kong Manager + cluster listener; no proxy.
env:
  role: control_plane
  proxy_listen: "off"          # a control plane serves no traffic
  database: postgres
  pg_host: konga-postgres.konga-cp.svc.cluster.local
  pg_port: 5432
  pg_database: kong
  pg_user:
    valueFrom: { secretKeyRef: { name: konga-postgres, key: username } }
  pg_password:
    valueFrom: { secretKeyRef: { name: konga-postgres, key: password } }

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001
  tls:
    enabled: false
  ingress:
    enabled: false

manager:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8002
    containerPort: 8002
  tls:
    enabled: false
  ingress:
    enabled: false

cluster:
  enabled: true
  type: ClusterIP
  tls:
    enabled: true
    servicePort: 8005
    containerPort: 8005

clustertelemetry:
  enabled: false              # Vitals / analytics telemetry: licensed

proxy:
  enabled: false

# kong migrations bootstrap / up / finish run as Argo CD Sync / PostSync hooks (chart defaults)
migrations:
  preUpgrade: true
  postUpgrade: true

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }
