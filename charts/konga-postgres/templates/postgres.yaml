apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: konga-postgres
  labels:
    app.kubernetes.io/name: konga-postgres
    app.kubernetes.io/part-of: kong-poc-a
spec:
  serviceName: konga-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: konga-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: konga-postgres
        app.kubernetes.io/part-of: kong-poc-a
    spec:
      {{- include "poc.podSecurityContext" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database | quote }} }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secret }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secret }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d {{ .Values.database }}"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: konga-postgres
spec:
  selector:
    app.kubernetes.io/name: konga-postgres
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
# Only pods of this namespace (control plane, its migration jobs, backup jobs) reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: konga-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: konga-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 5432, protocol: TCP }
