# Leg-specific values for kong/ingress. Non-secret only.
# KONNECT_* placeholders are filled by scripts/konnect-setup.sh leg1.
controller:
  ingressController:
    ingressClass: kong-leg1
    watchNamespaces: [leg1]
    env:
      gateway_api_controller_name: konghq.com/kic-gateway-controller-leg1
    konnect:
      controlPlaneID: "c189fdf3-4bcf-4dce-a508-b770e1b69ba7"
gateway:
  env:
    cluster_telemetry_endpoint: "a80241c710.eu.tp.konghq.com:443"
    cluster_telemetry_server_name: "a80241c710.eu.tp.konghq.com"
