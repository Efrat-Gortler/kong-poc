# Source: idp/templates/mini-issuer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak          # same name as the Keycloak Deployment: scripts and tests address one IdP
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: mini-issuer
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: 1             # keys live in memory: one replica, one key set
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: mini-issuer
        app.kubernetes.io/part-of: kong-poc
      annotations:
        checksum/code: a30c115f4921
    spec:
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: docker.io/library/python:3.12.8-slim
          command: ["python", "-u", "/app/mini_issuer.py"]
          env:
            - { name: ISSUER_BASE, value: "http://keycloak.idp.svc.cluster.local:8080" }
            - { name: REALM_DIR, value: /realms }
            - { name: PORT, value: "8080" }
          envFrom:
            - secretRef: { name: idp-test-credentials }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 24Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: realms, mountPath: /realms, readOnly: true }
      volumes:
        - name: code
          configMap: { name: mini-issuer }
        - name: realms
          configMap: { name: keycloak-realms }

