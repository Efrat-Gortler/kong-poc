kind: Ingress
metadata:
  name: blocking-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: blocking-blocking.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blocking-service
                port:
                  name: http
