apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gslb
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: gslb-gslb-sim.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gslb
                port:
                  name: http

---
# Source: gslb-sim/templates/gslb.yaml
# POC only: the drain/ready API. In production this is the GSLB vendor's own console.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gslb-control
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: gslb-control-gslb-sim.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gslb
                port:
                  name: control
