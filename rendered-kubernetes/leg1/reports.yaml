# Source: mock-service/templates/deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: reports
  labels:
    app.kubernetes.io/name: reports
    app.kubernetes.io/part-of: kong-poc
  annotations:
    
    konghq.com/connect-timeout: "2000"
    konghq.com/read-timeout: "10000"
    konghq.com/write-timeout: "10000"
spec:
  selector:
    app.kubernetes.io/name: reports
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# Source: mock-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels:
    app.kubernetes.io/name: reports
    app.kubernetes.io/part-of: kong-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reports
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reports
        app.kubernetes.io/part-of: kong-poc
      annotations:
        checksum/code: 3c4c36959933
    spec:
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: docker.io/library/python:3.12.8-slim
          command: ["python", "-u", "/app/echo.py"]
          env:
            - { name: LEG, value: "leg1" }
            - { name: COMPONENT, value: "reports" }
            - { name: PORT, value: "8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap:
            name: reports-echo

