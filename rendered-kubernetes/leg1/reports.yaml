apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reports
  namespace: leg1
  labels:
    app.kubernetes.io/part-of: kong-poc
    kong-poc/route: reports
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: "reports-rl-route,reports-rl-user"
spec:
  parentRefs:
    - name: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /reports
      backendRefs:
        - name: reports
          port: 8080

